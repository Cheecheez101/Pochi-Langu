version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pochi-langu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pochi_langu
      POSTGRES_USER: pochi_langu
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pochi_langu -d pochi_langu"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
